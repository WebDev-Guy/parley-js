name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing (OIDC) and provenance attestation
  id-token: write

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No registry-url here: it writes an .npmrc expecting NODE_AUTH_TOKEN,
      # which can take precedence over trusted publishing (OIDC) auth.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      # Trusted publishing requires npm >= 11.5.1
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm ci

      # Authenticates to npm via trusted publishing (OIDC) - no NPM_TOKEN.
      # Trusted publisher configured on npmjs.com for this repo + release.yml.
      # Stays on changesets/action v1: v2 requires Changesets v3 and this repo
      # uses @changesets/cli v2. v1 >= 1.7.0 supports OIDC when NPM_TOKEN is unset.
      - name: Create release PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # Opens/updates a 'chore: version packages' PR when changesets exist;
          # publishes to npm (with provenance) when no changesets are pending
          # and the package.json version is not yet on npm.
          # version:packages also syncs package-lock.json with the new version.
          version: npm run version:packages
          publish: npm run release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
